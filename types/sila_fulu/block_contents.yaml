SilaFulu:
  KZGProofs:
    type: array
    items:
      $ref: "../primitive.yaml#/KZGProof"
    minItems: 0
    maxItems: 33554432 # FIELD_ELEMENTS_PER_EXT_BLOB * MAX_BLOB_COMMITMENTS_PER_BLOCK

  BlockContents:
    type: object
    description: "The required object for block production according to the SilaFulu CL spec."
    required: [block, kzg_proofs, blobs]
    properties:
      block:
        $ref: "../electra/block.yaml#/Electra/BeaconBlock"
      kzg_proofs:
        description: "Cell proofs of the blobs as defined in SIP-7594"
        $ref: "#/SilaFulu/KZGProofs"
      blobs:
        $ref: "../sila_deneb/block_contents.yaml#/SilaDeneb/Blobs"

  SignedBlockContents:
    type: object
    description: "The required signed components of block production according to the SilaFulu CL spec."
    required: [signed_block, kzg_proofs, blobs]
    properties:
      signed_block:
        $ref: "../electra/block.yaml#/Electra/SignedBeaconBlock"
      kzg_proofs:
        description: "Cell proofs of the blobs as defined in SIP-7594"
        $ref: "#/SilaFulu/KZGProofs"
      blobs:
        $ref: "../sila_deneb/block_contents.yaml#/SilaDeneb/Blobs"
